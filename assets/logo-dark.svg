<svg width="260" height="70" viewBox="0 0 260 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="yellow-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="yellow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FCD116" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g id="pass-logo" filter="url(#yellow-glow)">
    <!-- Padlock Shackle -->
    <path d="M22 28V19C22 11.82 27.82 6 35 6C42.18 6 48 11.82 48 19V28" stroke="url(#yellow-brand-grad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Padlock Body -->
    <rect x="10" y="25" width="50" height="38" rx="9" fill="url(#yellow-brand-grad)"/>
    <!-- Keyhole -->
    <circle cx="35" cy="40" r="4" fill="#070c1e"/>
    <path d="M33 42L31.5 53H38.5L37 42Z" fill="#070c1e"/>
    <!-- PASS Typography -->
    <text x="74" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="42" letter-spacing="4.5" fill="url(#yellow-brand-grad)">PASS</text>
    <!-- Modern Accent Dot -->
    <circle cx="228" cy="24" r="4" fill="#FCD116"/>
  </g>
</svg>
