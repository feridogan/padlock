<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="icon-yellow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FCD116" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="#070c1e"/>
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="url(#icon-yellow-grad)" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Centered Glowing Padlock and PASS Typography -->
  <g filter="url(#icon-glow)">
    <!-- Padlock Shackle -->
    <path d="M192 198V146C192 110.654 220.654 82 256 82C291.346 82 320 110.654 320 146V198" stroke="url(#icon-yellow-grad)" stroke-width="34" stroke-linecap="round"/>
    <!-- Padlock Body -->
    <rect x="136" y="186" width="240" height="176" rx="36" fill="url(#icon-yellow-grad)"/>
    <!-- Keyhole -->
    <circle cx="256" cy="254" r="18" fill="#070c1e"/>
    <path d="M246 262L240 312H272L266 262Z" fill="#070c1e"/>
    <!-- Brand Typography -->
    <text x="256" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="8" fill="url(#icon-yellow-grad)">PASS</text>
  </g>
</svg>
