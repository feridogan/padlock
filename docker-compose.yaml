services:
  # =================================================================
  # PADLOC BACKEND SERVER (API)
  # =================================================================
  server:
    build:
      context: .
      dockerfile: Dockerfile-server
    image: padloc/server:latest
    restart: unless-stopped
    expose:
      - "3005"
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=Host(`api-pass.feridundogan.com`)"
      - "traefik.http.routers.server.entrypoints=https"
      - "traefik.http.routers.server.tls=true"
      - "traefik.http.routers.server.tls.certresolver=letsencrypt"
      - "traefik.http.services.server.loadbalancer.server.port=3005"
    env_file:
      - path: .env
        required: false
    environment:
      - PL_TRANSPORT_HTTP_PORT=3005
      - PL_SERVER_PORT=3005
      - PL_SERVER_URL=${PL_SERVER_URL:-https://api-pass.feridundogan.com}
      - PL_PWA_URL=${PL_PWA_URL:-https://pass.feridundogan.com}
      - PL_ASSETS_DIR=/assets
      - PL_ATTACHMENTS_DIR=/attachments
      - PL_DATA_STORAGE_BACKEND=${PL_DATA_STORAGE_BACKEND:-leveldb}
      - PL_DATA_LEVELDB_PATH=${PL_DATA_LEVELDB_PATH:-/data}
      - PL_SERVER_DISABLE_MFA=${PL_SERVER_DISABLE_MFA:-true}
      - PL_SERVER_VERIFY_EMAIL_ON_SIGNUP=${PL_SERVER_VERIFY_EMAIL_ON_SIGNUP:-false}
      - PL_EMAIL_BACKEND=${PL_EMAIL_BACKEND:-smtp}
      - PL_EMAIL_SMTP_HOST=${PL_EMAIL_SMTP_HOST:-${SMTP_HOST:-localhost}}
      - PL_EMAIL_SMTP_PORT=${PL_EMAIL_SMTP_PORT:-${SMTP_PORT:-587}}
      - PL_EMAIL_SMTP_USER=${PL_EMAIL_SMTP_USER:-${SMTP_USER:-}}
      - PL_EMAIL_SMTP_PASSWORD=${PL_EMAIL_SMTP_PASSWORD:-${SMTP_PASS:-}}
      - PL_EMAIL_SMTP_FROM=${PL_EMAIL_SMTP_FROM:-${SMTP_FROM:-}}
    volumes:
      - padloc_data:/data
      - padloc_attachments:/attachments
      - ./assets:/assets:ro

  # =================================================================
  # PADLOC PROGRESSIVE WEB APP (PWA FRONTEND)
  # =================================================================
  pwa:
    build:
      context: .
      dockerfile: Dockerfile-pwa
    image: padloc/pwa:latest
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - "8080"
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.pwa.rule=Host(`pass.feridundogan.com`)"
      - "traefik.http.routers.pwa.entrypoints=https"
      - "traefik.http.routers.pwa.tls=true"
      - "traefik.http.routers.pwa.tls.certresolver=letsencrypt"
      - "traefik.http.services.pwa.loadbalancer.server.port=8080"
    env_file:
      - path: .env
        required: false
    environment:
      - PL_SERVER_URL=${PL_SERVER_URL:-https://api-pass.feridundogan.com}
      - PL_PWA_URL=${PL_PWA_URL:-https://pass.feridundogan.com}
      - PL_PWA_PORT=8080
      - PL_ASSETS_DIR=/assets
    volumes:
      - ./assets:/assets:ro

volumes:
  padloc_data:
    driver: local
  padloc_attachments:
    driver: local
